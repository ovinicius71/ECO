[project]
name = "eco-api"
version = "0.0.0"
description = "API do Eco: letras, tradução, dicionário e listas de palavras"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
